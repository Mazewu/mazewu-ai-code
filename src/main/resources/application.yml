# AI 模型配置
langchain4j:
  open-ai:
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: YOUR_DEEPSEEK_API_KEY
      model-name: deepseek-reasoner
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://api.deepseek.com
      api-key: YOUR_DEEPSEEK_API_KEY
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: YOUR_DEEPSEEK_API_KEY
      model-name: deepseek-v4-flash
      max-tokens: 8192
      log-requests: true
      log-responses: true
    chat-model:
      base-url: https://api.deepseek.com
      api-key: YOUR_DEEPSEEK_API_KEY
      model-name: deepseek-v4-flash
      max-tokens: 8192
      log-requests: true
      log-responses: true
      max-retries: 3
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: https://YOUR_COS_BUCKET.cos.ap-shanghai.myqcloud.com
    secretId: YOUR_COS_SECRET_ID
    secretKey: YOUR_COS_SECRET_KEY
    region: ap-shanghai
    bucket: YOUR_COS_BUCKET
# Pexels 图片搜索配置
pexels:
  api-key: YOUR_PEXELS_API_KEY

# 阿里云 DashScope 配置
dashscope:
  api-key: YOUR_DASHSCOPE_API_KEY
  image-model: wan2.2-t2i-flash




