spring:
  application:
    name: mazewu-ai-code-backend


  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000

  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mazewu_ai_code
    username: root
    password: YOUR_MYSQL_PASSWORD
  profiles:
    active: local
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password: YOUR_REDIS_PASSWORD
      ttl: 3600
      database: 0


server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
